function setNav(){navWork.classList.toggle("on",view==="workouts"||view==="session");navCustom.classList.toggle("on",view==="custom");navProgress.classList.toggle("on",view==="history")}
function render(){setNav();view==="session"&&state.session?renderSession():view==="history"?renderHistory():view==="custom"?renderBuilder():renderHome()}
function workoutCard(w,isCustom=false){let moves=w.pairs.reduce((n,p)=>n+p[1].reduce((m,e)=>m+e[2].length,0),0);return`<article class="card ${isCustom?"custom-card":""}"><div><span class="num">${w.day}</span><span class="tag">${esc(w.focus)}</span></div><h2>${esc(w.title)}</h2><p>${w.pairs.length} BLOCKS · ${esc(w.time)}</p><span class="options-count">${moves} EXERCISE CHOICES</span><div class="preview">${w.pairs.slice(0,3).map(p=>`<div><b>${p[0]}</b>${p[1].slice(0,2).map(e=>esc(e[0])).join(" + ")}</div>`).join("")}</div><button class="primary" onclick="start('${w.id}')">Start workout <span>→</span></button>${isCustom?`<div class="card-actions"><button class="secondary" onclick="editCustom('${w.id}')">Edit template</button><button class="secondary" onclick="deleteCustom('${w.id}')">Delete</button></div>`:""}</article>`}
function renderHome(){let active=getWorkout(state.session&&state.session.workoutId),resume=state.session&&active?`<button class="resume" onclick="view='session';render()"><span>WORKOUT IN PROGRESS · ${esc(active.title)}</span><span>RESUME →</span></button>`:"";app.innerHTML=`<section class="hero"><div><p class="eyebrow">ANTAGONIST TRAINING · FLEXIBLE 4-DAY PLAN</p><h1>Your plan.<br><span class="outline">Your moves.</span></h1><p>Keep the structure you love. Swap any exercise for an equivalent that fits your body, equipment, and mood.</p></div><div class="hero-stat">${state.history.length}<small>SESSIONS COMPLETED</small></div></section><div class="flex-note"><b>↔</b><div><b>Every movement is interchangeable.</b><br><span>Start a workout, then tap any exercise name to choose an alternative.</span></div></div>${resume}<section class="grid">${W.map(w=>workoutCard(w)).join("")}</section><div class="section-head"><div><h2>My custom workouts</h2><p>${state.customWorkouts.length} SAVED TEMPLATE${state.customWorkouts.length===1?"":"S"}</p></div><button class="tool" onclick="newCustom()">+ Create workout</button></div>${state.customWorkouts.length?`<section class="grid">${state.customWorkouts.map(w=>workoutCard(w,true)).join("")}</section>`:`<div class="empty-custom"><h2>Build a workout from scratch.</h2><p>Choose from ${librarySize} exercises by muscle group—or type your own.</p><button class="primary" onclick="newCustom()">Create my first workout <span>→</span></button></div>`}`}
function start(id){if(state.session&&!confirm("Replace your workout in progress?"))return;let w=getWorkout(id);if(!w)return;state.session=blank(w);save();view="session";render();scrollTo(0,0)}
function inferGroup(name){return libraryGroups.find(g=>LIB[g].includes(name))||"__other__"}
function makeDraftExercise(name="Barbell bench press",target="8–12 reps",sets=3){let group=inferGroup(name);return{name,target,sets:Math.max(1,Math.min(20,parseInt(sets)||3)),group,custom:group==="__other__"}}
function freshDraft(id=null){return{id:id||("custom-"+Date.now()),title:"",focus:"Custom",minutes:"45",blocks:[{exercises:[makeDraftExercise("Barbell bench press"),makeDraftExercise("Pull-up")]}]}}
function newCustom(){draft=freshDraft();view="custom";render();scrollTo(0,0)}
function editCustom(id){let w=state.customWorkouts.find(x=>x.id===id);if(!w)return;draft={id:w.id,title:w.title,focus:w.focus,minutes:String(parseInt(w.time)||45),blocks:w.pairs.map(p=>({exercises:p[1].map(e=>makeDraftExercise(e[0],e[1],e[3]))}))};view="custom";render();scrollTo(0,0)}
function draftField(f,v){draft[f]=v}function draftExercise(b,i,f,v){draft.blocks[b].exercises[i][f]=v}
function draftGroup(b,i,g){let e=draft.blocks[b].exercises[i];e.group=g;e.custom=g==="__other__";e.name=e.custom?"":LIB[g][0];render()}
function chooseDraftExercise(b,i,v){let e=draft.blocks[b].exercises[i];e.custom=v==="__custom__";e.name=e.custom?"":v;render()}
function addDraftBlock(){draft.blocks.push({exercises:[makeDraftExercise("Barbell bench press"),makeDraftExercise("Pull-up")]});render()}
function addDraftExercise(b){draft.blocks[b].exercises.push(makeDraftExercise());render()}
function removeDraftBlock(b){if(draft.blocks.length===1)return alert("A workout needs at least one block.");draft.blocks.splice(b,1);render()}
function removeDraftExercise(b,i){if(draft.blocks[b].exercises.length===1)return alert("A block needs at least one exercise.");draft.blocks[b].exercises.splice(i,1);render()}
function groupOptions(selected){return`${libraryGroups.map(g=>`<option ${selected===g?"selected":""}>${g}</option>`).join("")}<option value="__other__" ${selected==="__other__"?"selected":""}>Other / custom</option>`}
function exercisePicker(e,bi,ei){if(e.group==="__other__")return`<input class="custom-name" placeholder="Type custom exercise name" value="${esc(e.name)}" oninput="draftExercise(${bi},${ei},'name',this.value)">`;return`<select onchange="chooseDraftExercise(${bi},${ei},this.value)">${LIB[e.group].map(x=>`<option ${!e.custom&&e.name===x?"selected":""}>${x}</option>`).join("")}<option value="__custom__" ${e.custom?"selected":""}>＋ Custom exercise…</option></select>${e.custom?`<input class="custom-name" placeholder="Type custom exercise name" value="${esc(e.name)}" oninput="draftExercise(${bi},${ei},'name',this.value)">`:""}`}
function renderBuilder(){if(!draft)draft=freshDraft();app.innerHTML=`<section class="builder"><button class="back" onclick="view='workouts';render()">← Back to workouts</button><p class="eyebrow">CUSTOM WORKOUT BUILDER</p><h1 class="builder-title">${state.customWorkouts.some(w=>w.id===draft.id)?"Edit":"Create"} your workout.</h1><div class="library-note"><b>${librarySize}</b> exercises organized into ${libraryGroups.length} muscle groups. Choose from the library or select “Custom exercise…” to type your own.</div><div class="form-grid"><label class="field">WORKOUT NAME<input placeholder="e.g. Hotel Upper Body" value="${esc(draft.title)}" oninput="draftField('title',this.value)"></label><label class="field">FOCUS<input placeholder="Full body" value="${esc(draft.focus)}" oninput="draftField('focus',this.value)"></label><label class="field">MINUTES<input inputmode="numeric" value="${esc(draft.minutes)}" oninput="draftField('minutes',this.value)"></label></div>${draft.blocks.map((b,bi)=>`<article class="draft-block"><div class="draft-head"><span><b>${String.fromCharCode(65+bi)}</b> BLOCK ${bi+1}</span><button onclick="removeDraftBlock(${bi})">Remove block</button></div>${b.exercises.map((e,ei)=>`<div class="draft-ex"><label class="field">MUSCLE GROUP<select onchange="draftGroup(${bi},${ei},this.value)">${groupOptions(e.group)}</select></label><label class="field">EXERCISE${exercisePicker(e,bi,ei)}</label><label class="field">TARGET<input placeholder="8–12 reps" value="${esc(e.target)}" oninput="draftExercise(${bi},${ei},'target',this.value)"></label><label class="field">SETS<input type="number" min="1" max="20" inputmode="numeric" value="${esc(e.sets||3)}" oninput="draftExercise(${bi},${ei},'sets',this.value)"></label><button class="remove-ex" title="Remove exercise" onclick="removeDraftExercise(${bi},${ei})">×</button></div>`).join("")}<button class="add" onclick="addDraftExercise(${bi})">+ Add exercise to block</button></article>`).join("")}<div class="builder-buttons"><button class="tool" onclick="addDraftBlock()">+ Add another block</button></div><button class="save-template" onclick="saveCustom()">Save custom workout →</button><p class="saved-note">Saved on this device. You can edit or reuse this template anytime.</p></section>`}
function saveCustom(){let title=draft.title.trim();if(!title)return alert("Give your workout a name.");if(!draft.blocks.length)return alert("Add at least one block.");let invalid=draft.blocks.some(b=>!b.exercises.length||b.exercises.some(e=>!e.name.trim()));if(invalid)return alert("Every exercise needs a name.");let workout={id:draft.id,day:"MY",title,focus:draft.focus.trim()||"Custom",time:(parseInt(draft.minutes)||45)+" min",pairs:draft.blocks.map((b,bi)=>[String.fromCharCode(65+bi),b.exercises.map(e=>{let move=ex(e.name.trim(),e.target.trim()||"8–12 reps",[]);move[3]=Math.max(1,Math.min(20,parseInt(e.sets)||3));return move})])};let i=state.customWorkouts.findIndex(w=>w.id===workout.id);if(i>=0)state.customWorkouts[i]=workout;else state.customWorkouts.push(workout);save();draft=null;view="workouts";render();scrollTo(0,document.body.scrollHeight)}
function deleteCustom(id){let w=state.customWorkouts.find(x=>x.id===id);if(!w||!confirm(`Delete "${w.title}"? Completed workout history will remain.`))return;state.customWorkouts=state.customWorkouts.filter(x=>x.id!==id);if(state.session&&state.session.workoutId===id)state.session=null;save();render()}
function progress(){let sets=Object.values(state.session.logs).flat();return[sets.filter(s=>s.done).length,sets.length]}
function renderSession(){let s=state.session,w=getWorkout(s.workoutId),[done,total]=progress();if(!w){state.session=null;save();view="workouts";return render()}app.innerHTML=`<button class="back" onclick="view='workouts';render()">← All workouts</button><p class="eyebrow">DAY ${w.day} · ${w.focus.toUpperCase()}</p><h1 class="session-title">${esc(w.title)}</h1><div class="session-tools"><button class="tool" onclick="shuffle()">↝ Shuffle all exercises</button><button class="tool" onclick="resetChoices()">↺ Restore original plan</button></div><div class="progress"><i style="width:${done/total*100}%"></i></div><p class="count">${done} of ${total} sets logged</p>${w.pairs.map((p,pi)=>`<article class="block"><div class="block-head"><b>${p[0]}</b> SUPERSET ${p[2]?"· "+p[2]:""}</div>${p[1].map((e,ei)=>exercise(e,pi+"-"+ei)).join("")}</article>`).join("")}<section class="cardio"><div><p class="eyebrow">BETWEEN ROUNDS</p><h2>Cardio log</h2></div><label>MODE<select onchange="cardio('mode',this.value)">${["Bike","Rower","Incline walk","Elliptical","Other"].map(x=>`<option ${s.cardio.mode===x?"selected":""}>${x}</option>`).join("")}</select></label><label>MINUTES<input inputmode="decimal" value="${esc(s.cardio.minutes)}" oninput="cardio('minutes',this.value)"></label><label>INTENSITY<select onchange="cardio('intensity',this.value)">${["Easy","Conversational","Hard"].map(x=>`<option ${s.cardio.intensity===x?"selected":""}>${x}</option>`).join("")}</select></label></section><label class="notes">SESSION NOTES<textarea oninput="state.session.notes=this.value;save()" placeholder="How did it feel?">${esc(s.notes)}</textarea></label><button class="finish" onclick="finish()">Finish workout <span>✓</span></button>`}
function exercise(e,key){let chosen=state.session.choices[key]||e[0];return`<div class="exercise"><label class="swap-label">CHOOSE EXERCISE</label><select class="swap" onchange="choose('${key}',this.value)">${e[2].map(x=>`<option ${chosen===x?"selected":""}>${x}</option>`).join("")}</select><small>${e[1]} · ${e[2].length} options</small><div class="heads"><span>SET</span><span>LB</span><span>REPS</span><span>DONE</span></div>${state.session.logs[key].map((s,i)=>`<div class="set ${s.done?"done":""}"><b>${i+1}</b><input inputmode="decimal" aria-label="${esc(chosen)} set ${i+1} weight" value="${esc(s.weight)}" oninput="upd('${key}',${i},'weight',this.value)"><input inputmode="numeric" aria-label="${esc(chosen)} set ${i+1} reps" value="${esc(s.reps)}" oninput="upd('${key}',${i},'reps',this.value)"><button aria-label="Mark set done" onclick="toggle('${key}',${i})">${s.done?"✓":""}</button></div>`).join("")}<button class="add" onclick="addSet('${key}')">+ Add set</button></div>`}
function choose(k,v){state.session.choices[k]=v;save()}function shuffle(){let w=getWorkout(state.session.workoutId);w.pairs.forEach((p,pi)=>p[1].forEach((e,ei)=>state.session.choices[pi+"-"+ei]=e[2][Math.floor(Math.random()*e[2].length)]));save();render()}function resetChoices(){let w=getWorkout(state.session.workoutId);w.pairs.forEach((p,pi)=>p[1].forEach((e,ei)=>state.session.choices[pi+"-"+ei]=e[0]));save();render()}
function upd(k,i,f,v){state.session.logs[k][i][f]=v;save()}function toggle(k,i){state.session.logs[k][i].done=!state.session.logs[k][i].done;save();render()}function addSet(k){let a=state.session.logs[k],last=a[a.length-1];a.push({weight:last.weight,reps:last.reps,done:false});save();render()}function cardio(f,v){state.session.cardio[f]=v;save()}
function finish(){let s=state.session,w=getWorkout(s.workoutId),end=new Date();state.history.unshift({...s,workoutTitle:w.title,workoutFocus:w.focus,workoutPairs:JSON.parse(JSON.stringify(w.pairs)),completedAt:end.toISOString(),durationMinutes:Math.max(1,Math.round((end-new Date(s.startedAt))/60000))});state.session=null;save();view="history";render();scrollTo(0,0)}
function renderHistory(){let st=stats();app.innerHTML=`<p class="eyebrow">YOUR TRAINING</p><h1 class="view-title">Progress,<br><span class="outline">made visible.</span></h1><section class="stats"><div><b>${state.history.length}</b><small>WORKOUTS</small></div><div><b>${st.mins}</b><small>CARDIO MIN</small></div><div><b>${Math.round(st.volume).toLocaleString()}</b><small>LB VOLUME</small></div></section>${state.history.length?state.history.map(historyItem).join(""):`<div class="empty"><h2>Your first rep starts the story.</h2><p>Complete a workout and your chosen exercises will appear here.</p><button class="primary" onclick="view='workouts';render()">Choose a workout →</button></div>`}${state.history.length?`<button class="danger" onclick="clearHistory()">Clear workout history</button>`:""}`}
function toggleHistory(id){openHistoryId=openHistoryId===id?null:id;render()}
function historyItem(h){let found=getWorkout(h.workoutId),w=found||{title:h.workoutTitle||"Custom workout",pairs:h.workoutPairs||[]},sets=Object.values(h.logs).flat().filter(s=>s.done).length,isOpen=openHistoryId===h.id,d=new Date(h.completedAt);return`<article class="history-item"><button onclick="toggleHistory('${h.id}')"><span class="date"><b>${String(d.getDate()).padStart(2,"0")}</b><small>${d.toLocaleString("en",{month:"short"}).toUpperCase()}</small></span><span><b>${esc(w.title)}</b><small>${sets} sets · ${h.durationMinutes} min · ${h.cardio.minutes||0} cardio min</small></span><span>${isOpen?"−":"+"}</span></button>${isOpen?`<div class="detail">${w.pairs.flatMap((p,pi)=>p[1].map((e,ei)=>{let k=pi+"-"+ei,l=(h.logs[k]||[]).filter(s=>s.done),name=(h.choices&&h.choices[k])||e[0];return l.length?`<p><b>${esc(name)}</b><span>${l.map(s=>(s.weight||"BW")+" × "+(s.reps||"—")).join(" · ")}</span></p>`:""})).join("")}${h.notes?`<blockquote>“${esc(h.notes)}”</blockquote>`:""}</div>`:""}</article>`}
function clearHistory(){if(confirm("Clear all completed workout history?")){state.history=[];save();render()}}
navWork.onclick=()=>{view="workouts";render()};navCustom.onclick=()=>{if(!draft)draft=freshDraft();view="custom";render()};navProgress.onclick=()=>{view="history";render()};render();
</script>
</body></html>
